services:
  # MongoDB for RAG Service
  mongodb:
    image: mongo:7.0
    container_name: rag_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-rag_db}
    volumes:
      # Use attached volume if MOUNTED_VOLUME_PATH is set (production), 
      # otherwise use local directory (development)
      - ${MOUNTED_VOLUME_PATH:-./data/mongodb}:/data/db
      - ./rag-service/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - app_network
    # Memory allocation: 3GB for MongoDB (database operations, indexes, cache)
    # Increased for 16GB droplet - more cache improves query performance
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Unified Backend Service (RAG + ChatKit)
  unified-backend:
    build:
      context: ./unified-backend
      dockerfile: Dockerfile
    container_name: unified_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - PORT=8000
      - MONGODB_CONNECTION_STRING=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password123}@mongodb:27017/${MONGO_DATABASE:-rag_db}?authSource=admin
      - DATABASE_NAME=${MONGO_DATABASE:-rag_db}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_CACHE_TTL_DAYS=${EMBEDDING_CACHE_TTL_DAYS:-30}
      # MCP Server path (mounted at /app/mcp in container)
      - MCP_BASE_DIR=/app/mcp
      # MCP Server environment variables
      - TEMPLATE_PATH=/app/mcp/quote.xlsx
      - OUTPUT_DIR=/app/mcp
      # RAG Service URL for MCP server (internal, no longer needed for HTTP but kept for compatibility)
      - RAG_SERVICE_URL=http://unified-backend:8000
      - DO_ACCESS_KEY=${DO_ACCESS_KEY:-DO00DK7ZU22GLQVH767D}
      - DO_SECRET_KEY=${DO_SECRET_KEY:-SPO1OnYRpw5pvBwh9dwSfec6c5eP+LNY1qYkxEY8TPs}
      - DO_SPACE_NAME=${DO_SPACE_NAME:-optimus}
      - DO_REGION=${DO_REGION:-ams3}
      - DO_ENDPOINT=${DO_ENDPOINT:-ams3.digitaloceanspaces.com}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      # Mount MCP server directory at /app/mcp
      - ./mcp:/app/mcp:ro
      # Uploads directory
      - ./unified-backend/uploads:/app/uploads:rw
      # Templates directory
      - ./unified-backend/templates:/app/templates:ro
      # Outputs directory
      - ./unified-backend/outputs:/app/outputs:rw
    networks:
      - app_network
    # Memory allocation: 4GB for unified backend (reduced from 10GB since no local model)
    # OpenAI embeddings don't require local model loading
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./agentkit-frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    ports:
      - "8081:80"    # Production: HTTP for domain (kavin.botnetworks.in)
      # - "443:443"  # HTTPS - uncomment if needed (SSL already set up on host)
    environment:
      - BACKEND_URL=http://unified-backend:8000
    depends_on:
      - unified-backend
    networks:
      - app_network
    # Memory allocation: 512MB for frontend (nginx, very lightweight)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

# Note: MongoDB data is stored on the attached volume (20GB) via bind mount
# Set MOUNTED_VOLUME_PATH environment variable to the mounted volume path
# Example: export MOUNTED_VOLUME_PATH=/mnt/mongodb
# If not set, uses ./data/mongodb as fallback

networks:
  app_network:
    driver: bridge

