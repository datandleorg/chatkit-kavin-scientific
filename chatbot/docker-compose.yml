services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password123}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ${MOUNTED_VOLUME_PATH:-./data/mongodb}:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HOST: "0.0.0.0"
      PORT: "8000"
      MONGODB_CONNECTION_STRING: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password123}@mongodb:27017/${MONGODB_DB:-kavin_scientific}?authSource=admin
      MONGODB_DB: ${MONGODB_DB:-kavin_scientific}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

